aid: ventrilo
name: Ventrilo.ai
description: 'Ventrilo.ai is a San Francisco AI startup (founded 2023, backed by Andreessen
  Horowitz, Bloomberg Beta, Conviction, Rain Capital, 112 Capital, and Gil Capital)
  building an AI browser assistant delivered as a Chrome extension. The product connects
  your open tabs, remembers context, auto-fills forms, drafts and rewrites text in
  place, and answers questions grounded in the pages you are working in — "no copy-pasting,
  no starting over." It ships as a free tier plus a $20/month Plus plan via chat.ventrilo.ai.
  The company publishes no public developer API, SDKs, or API documentation; its
  api.ventrilo.ai backend is private (HTTP 401). It does publish an RFC 9116 security.txt,
  a responsible-disclosure security policy with safe harbor, and claims SOC 2 certification.
  Not related to the classic Ventrilo VoIP software.'
